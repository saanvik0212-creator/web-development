<!DOCTYPE html>

<html>

<body>

  <h1>Details of Users</h1>

  <form>
    <fieldset>
      <legend>Personal Information:</legend>
      <label>First name:</label>
      <input type="text" id="fname" name="fname" placeholder="Enter your first name"><br><br>
      <label>Last name:</label>
      <input type="text" id="lname" name="lname" placeholder="Enter your last name"><br><br>
      <label>Gender:</label><br><br>
      <input type="radio" name="subject" value="Male"> Male<br><br>
      <input type="radio" name="subject" value="Female"> Female<br><br>
      <input type="radio" name="subject" value="Other"> Other<br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>
      <label for="email">Password:</label>
      <input type="password" name="password"><br><br>
      <label for="birthday">Birthday:</label>
      <input type="date" id="birthday" name="birthday"><br><br>
      <label>Country</label>
      <select id="country name=country">
        <option value="">Select your own country</option>
        <option value="IN">India</option>
        <option value="US">United States</option>
        <option value="AU">Australia</option>
        <option value="UK">United Kingdom</option>
      </select><br><br>
      <label for="userphone">Phone Number:</label>
      <input type="tel" id="userPhone name=phone">
      <label> Favorite City </label>
      <br><br>
      <input type="checkbox">
      Mumbai
      <br>
      <input type="checkbox">
      Hyderabad
      <br>

      <center>
        <button>Submit</button>
        <input type="reset" name="reset" />
      </center>
    </fieldset>
  </form>

</body>

</html>
