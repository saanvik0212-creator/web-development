<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Objects</h2>
    <p id="demo"></p>
    <script>
        let animal=["dog","rabbit","mango",37,"tiger",0.58]
        for(let i=0;i<=5;i++){
            document.write(animal[i])
        }
        let student={
            name:"Saanvi",
            city:"Mumbai"
        }
        document.write(student.name)

        let ans=Math.pow(7,3)
        document.write(ans)
        let res=Math.abs(-17)
         document.write(res)

         let nums=[3,17,89,7]
         let max=0
         for(let i=0;i<=3;i++){
            if(nums[i]>max){
                max=nums[i]
            }
         }
         document.write(max)


    </script>
    
</body>
</html>
