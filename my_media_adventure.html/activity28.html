<body>
    <h2>Arrow Function</h2>
    <p id="result"></p>
    <script>
        const sub = (s,t) => s - t;
        function addition(){
            return s + t
        }
        const add = (s,t) => s + t;
        const division = (s,t) => s/t;
        document.getElementById("result").innerHTML= sub(17,2);
        document.getElementById("result").innerHTML= add(11,2);
        document.getElementById("result").innerHTML= division(19,2);
        document.getElementById("result").innerHTML= sub(17,2);
    </script>
    
</body>
