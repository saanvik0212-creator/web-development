<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saanvi's Bank App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        #app-title{
            text-transform: uppercase;
            text-decoration: underline;
        }
        #balance-label{
            text-decoration: underline;
        }
        #amount-label{
            text-decoration: underline;
        }
        #app{
            background-color: aliceblue;
            width: 300px;
            border-radius: 20px;
            padding: 27px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
            margin: 40px auto;

        }
        .action{
            padding: 20px;
            border: 0px;
            border-radius: 17px;
            color: white;
            cursor: pointer;
            box-shadow: small;
        }
        #credit-btn{
            background-color: green;
        }
        #debit-btn{
            background-color: red;
        }
       
        #note{
            text-decoration: line-through;
            font-size: 29px;
            color: grey;

        }
    </style>
</head>
<body>
    <div id="app">
    <div id="app-title">Saanvi's Bank</div>
    <div id="balance-box">
        <p id="balance-label">Available Balance</p>
        <p id="balance">1000</p>
        
    </div>
    <div id="entry-box">
        <label id="amount-label" for="amount">Enter Amount</label>
         <input id="amount" type="number" placeholder="0">
    </div>
    <div id="button-box">
        <button id="credit-btn">Credit</button>
        <button id="debit-btn">Debit</button>
    </div>
    <p id="note">Terms and Conditions Apply</p>
    <p id="message"></p>
   
</div>
<script>




function getBalance() {
    return Number(document.getElementById("balance").innerText);
}

function printBalance(num) {
    document.getElementById("balance").innerText = num;
}

function getAmount() {
    return Number(document.getElementById("amount").value);
}

function showMessage(text) {
    document.getElementById("message").innerText = text;
}

function clearAmount() {
    document.getElementById("amount").value = "";
}




function isAmountValid() {
    var typed = document.getElementById("amount").value;

    if (typed == "") {
        showMessage("Please enter an amount.");
        return false;
    } else if (Number(typed) <= 0) {
        showMessage("Amount must be more than zero.");
        return false;
    }

    return true;
}



document.getElementById("credit-btn").addEventListener("click", function () {

    if (isAmountValid() == false) {
        return;
    }

    var amount = getAmount();
    var newBalance = getBalance() + amount;

    printBalance(newBalance);
    showMessage("Credited " + amount + " successfully.");
    clearAmount();

});



document.getElementById("debit-btn").addEventListener("click", function () {

    if (isAmountValid() == false) {
        return;
    }

    var amount = getAmount();

    if (amount > getBalance()) {
        showMessage("Not enough balance.");
        return;
    }

    var newBalance = getBalance() - amount;

    printBalance(newBalance);
    showMessage("Debited " + amount + " successfully.");
    clearAmount();

});
      

    </script>
    
</body>
</html>
