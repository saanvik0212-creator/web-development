<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        p{color: rgb(14, 20, 21);background-color: rgb(204, 247, 233);

        }
    </style>
</head>
<body>
<h1>Simple Calculator</h1>
<p>A program that performs basic math tasks like addition , subtraction, multiplication and division .</p>
<p id="add"></p>
<p id="sub"></p>
<p id="mul"></p>
<p id="div"></p>
<script>
    var num1 = 17;
    var num2 = 7;
    
var add = num1 + num2;
var sub = num1 - num2;
var mul = num1 * num2;
var div = num1 / num2;

document.getElementById("add").innerHTML =
"The added value is: " + add;
document.getElementById("sub").innerHTML =
"The subtracted value is: " + sub;
document.getElementById("mul").innerHTML =
"The multiplied value is: " + mul;
document.getElementById("div").innerHTML =
"The divided value is: " + div;
</script>
    
</body>
</html>
