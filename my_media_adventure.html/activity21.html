<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function table(n){
            for(let i=1;i<=10;i++){
                document.write(i*n)
                document.write("<br>")
            }

        }
        for(let i=1;i<=10;i++){
            table(i)
        }
    </script>
    
</body>
