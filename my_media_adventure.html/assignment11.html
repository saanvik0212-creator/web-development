<!DOCTYPE html>
<html lang="en">
<head>
  <title>My Study Progress Dashboard</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <style>
    body { background-color: #8ea8f1; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; }
    .jumbotron { background-color: #82dc9c; border-left: 6px solid #FF5A43; }
    .jumbotron h1 { color: #f3fe95; }
    .section-title { color: #FF5A43; margin-top: 30px; margin-bottom: 15px; }
    p { font-weight: bold; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="jumbotron jumbotron-fluid">
    <div class="container">
      <h1>My Study Progress Dashboard</h1>
      <p class="lead">A page where you can check your overall performance across all subjects and track your progress.</p>
      <button class="btn btn-info">Math</button>
      <button class="btn btn-warning">Science</button>
      <button class="btn btn-danger">English</button>
      <button class="btn btn-success">Coding</button>
    </div>
  </div>

  <div class="container">
    <h2 class="section-title">Lessons Completed <span class="badge badge-primary">26</span></h2>

    <p>Math <span class="badge badge-info">7 lessons</span></p>
    <p>Science <span class="badge badge-warning">5 lessons</span></p>
    <p>English <span class="badge badge-danger">6 lessons</span></p>
    <p>Coding <span class="badge badge-success">8 lessons</span></p>
    
    <h2 class="section-title">Subject Progress</h2>

    <p>Math</p>
    <div class="progress mt-4">
      <div class="progress-bar bg-info" style="width: 87%">87%</div>
    </div>

    <p>Science</p>
    <div class="progress my-3">
      <div class="progress-bar bg-warning" style="width: 82%">82%</div>
    </div>

    <p>English</p>
    <div class="progress mx-2">
      <div class="progress-bar bg-danger" style="width: 65%">65%</div>
    </div>

    <p>Coding</p>
    <div class="progress mb-5">
      <div class="progress-bar bg-success" style="width: 94%">94%</div>
    </div>

  </div>

  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
