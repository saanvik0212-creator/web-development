<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>A function will access the code in the function.</p>
    <button type="button" onclick="saanvi(5)">Click here!</button>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <script>
       
        function saanvi(a,b){
            if (b===undefined){
                b=7
            }
         
           document.getElementById("demo").innerHTML= a*b
           document.getElementById("demo1").innerHTML=a

        }
        document.getElementById("demo2").innerHTML=b
    </script>   
</body>
</html>
