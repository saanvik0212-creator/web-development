<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Java Script </h2>
    <p id="error"></p>
    <script>
        try{
            alert("Welcome guest")

        catch(err){
            document.getElementById("error").innerHTML = err.message;
        }
    </script>
