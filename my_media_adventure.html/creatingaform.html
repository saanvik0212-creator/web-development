            <label for="Gender">Gender:</label><br>
            <input type="radio">
            Female
            <input type="radio">
            Male<br>
            <br>
            <label for="date">date:</label>
            <input type="date" id="date"><br><br>
            Favourite City<br>

            Pune

            Mumbai
            <br>
            <button>Submit</button>
        </fieldset>
    </form>
